<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#0b101c"/><meta name="description" content="ESCAPEVERSE — cinematic local cooperative escape room game"/><title>ESCAPEVERSE — The Final Heist</title><style>
:root{color-scheme:dark;--bg:#090d17;--panel:#151e2e;--line:#304058;--gold:#ebc476;--ink:#edf0f5;--sub:#a3b0c3;--good:#74e1ba}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{background:radial-gradient(ellipse at 50% -15%,#26334c 0%,transparent 48%),#090d17}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:760px;margin:0 auto;min-height:100dvh}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid #2a3447;background:#0d1522cc}.brand{font-size:15px;letter-spacing:2px;font-weight:900;color:var(--gold)}.brand-icon{display:inline-grid;place-items:center;width:27px;height:27px;border:1px solid var(--gold);border-radius:50%;margin-right:8px}.muted{color:var(--sub)}.sm{font-size:12px}.body{padding:24px 22px 38px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--gold)}h1,h2,h3{line-height:1.15;margin:10px 0}h1{font-size:clamp(32px,6vw,52px);letter-spacing:-1.6px}h2{font-size:27px;letter-spacing:-.7px}h3{font-size:18px}p{line-height:1.65;color:#bfcbdb}.hero{height:240px;border-radius:20px;border:1px solid #39455b;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 66%,#b5935940 0%,transparent 45%),repeating-linear-gradient(90deg,transparent 0 70px,#1a273a 70px 73px),linear-gradient(145deg,#253a50,#0d1727);display:grid;place-items:center;margin-bottom:21px}.vault{width:170px;height:170px;border-radius:50%;border:15px solid #626e7c;background:radial-gradient(circle,#d8c49b 0 6%,#5a6878 7% 22%,#1c2d42 23% 55%,#455368 56% 60%,#1d2a3a 61%);box-shadow:0 0 0 10px #0a1627,0 22px 45px #000a;display:grid;place-items:center;font-size:55px;color:#d9c69a}.hero-caption{position:absolute;bottom:13px;left:18px;letter-spacing:2px;font-size:10px;color:#bfc9d9}.panel{background:linear-gradient(160deg,#192538,#131c2c);border:1px solid #324057;border-radius:16px;padding:18px;margin:14px 0}.btn{border-radius:12px;padding:13px 17px;border:1px solid #53647c;background:#243349;color:#e9eef7;font-size:14px;font-weight:750;min-height:46px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#141924}.btn.ghost{background:transparent}.btn.full{width:100%}.btn:hover:not(:disabled),.tile:hover{filter:brightness(1.12)}.stack{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.badges{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.badge{font-size:11px;border-radius:7px;background:#2a394f;border:1px solid #43516a;padding:6px 9px;color:#d4ddea}.gold{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{padding:15px;text-align:left;border:1px solid #34455d;border-radius:15px;background:#192638;color:#eef1f5;min-height:112px}.tile strong{display:block;margin:10px 0 3px}.tile span{font-size:12px;color:#a4b3c6}.field{width:100%;padding:12px 13px;background:#0e1929;border:1px solid #4a5b72;color:white;border-radius:10px;outline:0}.field:focus{border-color:var(--gold)}.name-row{display:grid;grid-template-columns:35px 1fr;align-items:center;gap:8px;margin:8px 0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.progress{height:6px;background:#303b4d;overflow:hidden;border-radius:10px;margin:13px 0 23px}.progress>div{background:var(--gold);height:100%;transition:width .2s}.timer{font-size:20px;font-weight:800;color:var(--gold)}.timer.danger{color:#ff8b8b}.camera{border-radius:12px;padding:13px;min-height:120px;background:repeating-linear-gradient(0deg,#112137,#112137 4px,#18283b 5px);border:1px solid #536176;text-align:left;color:white}.camera.found{border-color:var(--gold)}.camera .number{font-size:34px;color:var(--gold);font-weight:850;margin-top:13px}.code{letter-spacing:9px;text-align:center;font-size:32px;color:var(--gold);padding:8px 0 18px}.keys{max-width:350px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{border:1px solid #53647c;border-radius:12px;padding:15px;color:white;background:#263449;font-size:20px;font-weight:700;min-height:57px}.opt{width:100%;text-align:left;padding:14px;border-radius:12px;background:#1b2c41;border:1px solid #495b73;color:white}.opt.selected{background:#4c452f;border-color:var(--gold)}.symbol{height:82px;font-size:36px}.message{border:1px solid #45556b;background:#263349;padding:14px;border-radius:11px;margin-top:14px;font-size:13px;line-height:1.5}.message.good{background:#183b32;border-color:#377b63;color:#adf4d3}.message.bad{background:#44252e;border-color:#8c4b52;color:#ffbcc1}.hint{background:#403829;border-color:#776035;color:#ffdda2}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.actions>*{flex:1}.score{font-size:38px;color:var(--gold);font-weight:900}.foot{font-size:11px;color:#8292a7;margin-top:25px;text-align:center}.story{font-size:16px;line-height:1.9}.art-screen{height:150px;background:radial-gradient(ellipse at center,#354b63,#101927 72%);border-radius:14px;margin:10px 0 17px;display:grid;place-items:center;font-size:70px;border:1px solid #45546b}.log{padding:12px;border-left:3px solid var(--gold);background:#1c2a3d;border-radius:8px;margin:9px 0;font-size:13px}.splash{padding:20px;background:radial-gradient(circle at center,#293850,#0d1422);border:1px solid #344760;border-radius:14px}.contrast{color:white;font-weight:750}.win{text-align:center;padding:35px 0}.win .medal{font-size:75px;color:var(--gold)}.notice{font-size:12px;color:#d6c397}button:focus-visible,input:focus-visible{outline:3px solid #ffe2a5;outline-offset:2px}@media(min-width:720px){.body{padding:30px 45px}.hero{height:290px}.grid.three{grid-template-columns:repeat(3,1fr)}}@media(max-width:390px){.body{padding:17px 14px}.panel{padding:14px}.hero{height:185px}.vault{transform:scale(.8)}.top{padding:14px}.btn{padding:12px 10px}}
</style></head><body><main class="app" id="app"></main><script>
(()=>{'use strict';const app=document.getElementById('app');const STORAGE='escapeverse_heist_v2';const maxSeconds=1800;let tick=null;const rooms=[{title:'The Security Feed',type:'Hidden evidence',icon:'◉',summary:'Inspect four cameras and recover the security gateway password.'},{title:'The Compromised Terminal',type:'Pattern logic',icon:'⌘',summary:'Break the numerical protocol to restore the employee access records.'},{title:'The Inside Contact',type:'Deduction',icon:'♟',summary:'Identify who transferred Project AURORA to the restricted vault.'},{title:'The Vault Mechanism',type:'Interactive symbols',icon:'✧',summary:'Rotate the four dials in the correct symbolic order.'},{title:'The Emergency Exit',type:'Evidence synthesis',icon:'⚿',summary:'Retrieve the final code fragments from your evidence locker and escape.'}];let s=fresh();function fresh(){return {page:'home',names:['Player 1','Player 2'],step:0,remaining:maxSeconds,deadline:null,hints:0,errors:0,found:[],entry:'',selected:null,dials:[1,3,0,2],evidence:[],hint:false,message:'',messageType:'',solved:[],ended:false}}function save(){try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE));if(x&&Array.isArray(x.names)&&typeof x.step==='number')s={...fresh(),...x}}catch(e){}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}function time(){let v=Math.max(0,s.remaining);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}function top(){return `<header class="top"><div class="brand"><span class="brand-icon">✦</span>ESCAPEVERSE</div><div class="sm muted">${s.page==='play'||s.page==='cleared'||s.page==='locker'?`<span id="clock" class="timer ${s.remaining<300?'danger':''}">${time()}</span>`:'THE FINAL HEIST'}</div></header>`}function button(t,a,cls=''){return `<button type="button" class="btn ${cls}" data-action="${a}">${t}</button>`}function page(content){app.innerHTML=top()+`<section class="body">${content}</section>`;save()}function art(icon='✣'){return `<div class="hero"><div class="vault">${icon}</div><div class="hero-caption">PROJECT AURORA • ACCESS RESTRICTED</div></div>`}
function home(){s.page='home';page(`${art()}<div class="eyebrow">ESCAPEVERSE / CASE FILE 001</div><h1>THE FINAL <span class="gold">HEIST</span></h1><p>One document. Five connected puzzles. Thirty minutes to escape. Gather your crew and uncover the truth behind Project AURORA.</p><div class="badges"><span class="badge">Crime & Mystery</span><span class="badge">30 minutes</span><span class="badge">2–6 players</span><span class="badge">Offline friendly</span></div><div class="panel"><div class="eyebrow">YOUR MISSION</div><p class="sm">Find the security code, decrypt the terminal, identify an insider, unlock the vault, and use recovered evidence to break out.</p></div>${button('START NEW MISSION →','lobby','primary full')}${s.solved.length>0&&!s.ended?`<div style="height:12px"></div>${button('RESUME MISSION','resume','full')}`:''}<p class="foot">Interactive browser demo • Original fiction • Local cooperative play</p>`)}function lobby(){s.page='lobby';page(`<div class="eyebrow">01 / CREW ASSEMBLY</div><h2>Prepare your team</h2><p>Play together using one device. Everyone can suggest answers. The lead investigator role rotates each round.</p><div class="panel"><div class="row"><strong>Investigators</strong><span class="muted sm">${s.names.length}/6</span></div>${s.names.map((x,i)=>`<div class="name-row"><span class="badge">${i+1}</span><input class="field" data-name="${i}" maxlength="20" value="${esc(x)}" aria-label="Player ${i+1} name"/></div>`).join('')}<div class="actions">${button('＋ Add','add')}${button('− Remove','remove')}</div></div><div class="panel"><div class="eyebrow">LOCAL CO-OP RULES</div><p class="sm">No account or internet required to play. The timer starts after the briefing. Each hint costs 100 points; each incorrect submitted answer costs 50 points. Progress saves on this device.</p></div>${button('CONTINUE TO BRIEFING →','briefing','primary full')}<div class="actions">${button('← Home','home')}</div>`)}function briefing(){s.page='briefing';page(`<div class="eyebrow">02 / MISSION BRIEFING</div><div class="art-screen">▣</div><h2>The clock is ticking.</h2><div class="panel story">11:47 PM. Your crew has entered North Tower Bank to recover a classified file called <b class="gold">Project AURORA</b>.<br/><br/>Suddenly, the security gates slam shut. The building is entering lockdown. An anonymous message flashes across the surveillance console:<br/><br/><em class="gold">"The truth is in the vault. Recover the evidence. Don't trust the person who sent you."</em></div><p class="sm">Your crew must gain access to the bank network, uncover the inside contact, open the vault and reach the emergency exit before the building seals.</p>${button('BEGIN 30-MINUTE MISSION →','start','primary full')}<div class="actions">${button('← Edit team','lobby')}</div>`)}function header(){return `<div class="row"><div class="eyebrow">STAGE ${s.step+1} OF 5</div><span class="muted sm">${esc(s.names[s.step%s.names.length])} leads</span></div><div class="progress"><div style="width:${s.step*20}%"></div></div><div class="eyebrow">${rooms[s.step].type.toUpperCase()}</div><h2>${rooms[s.step].title}</h2><p class="sm">${rooms[s.step].summary}</p>`}function keyboard(n){const digits=['1','2','3','4','5','6','7','8','9','CLEAR','0','⌫'];return `<div class="panel"><div class="eyebrow">ENTER ${n}-DIGIT CODE</div><div class="code mono" aria-live="polite">${esc(s.entry).padEnd(n,'·')}</div><div class="keys">${digits.map(v=>`<button class="key" data-action="key" data-val="${v}" ${s.entry.length>=n&&!['CLEAR','⌫'].includes(v)?'disabled':''}>${v}</button>`).join('')}</div><div style="height:12px"></div>${button('SUBMIT CODE →','submit','primary full')}</div>`}function puzzle(){let i=s.step;if(i===0)return `<div class="panel"><p class="sm">The gateway demands four digits. Each camera reveals one number once inspected. Read camera feeds in ascending order.</p></div><div class="grid">${['NORTH LOBBY','EAST CORRIDOR','SERVER ROOM','VAULT FLOOR'].map((c,j)=>`<button class="camera ${s.found.includes(j)?'found':''}" data-action="camera" data-val="${j}"><div class="row"><span class="badge">CAM 0${j+1}</span><span class="sm" style="color:#ff9fa6">● REC</span></div><div class="muted sm" style="margin-top:9px">${c}</div><div class="number">${s.found.includes(j)?[4,8,2,6][j]:'???'}</div></button>`).join('')}</div>${keyboard(4)}`;if(i===1)return `<div class="panel mono"><div class="eyebrow">TERMINAL ONLINE</div><p style="color:#93e0bb">&gt; SECURITY OVERRIDE</p><p class="contrast">2 → 4 → 8 → 16 → ??</p><p class="sm">Protocol: Each value follows one consistent mathematical rule.</p></div>${keyboard(2)}`;if(i===2)return `<div class="panel"><p class="sm">Audit logs confirm the transfer took place at <b>23:20</b> through a door requiring <b>Level 5 authorization</b>. Which employee matches <em>both</em> conditions?</p></div><div class="stack">${[['Jonas Reed','2','23:18'],['Mara Voss','5','23:20'],['Eli Cross','5','22:10'],['Nina Park','3','23:20']].map((e,j)=>`<button class="opt ${s.selected===j?'selected':''}" data-action="select" data-val="${j}"><strong>${e[0]}</strong><div class="muted sm">Access level ${e[1]} · Last activity ${e[2]}</div></button>`).join('')}</div><div style="height:14px"></div>${button('CONFIRM EMPLOYEE →','submit','primary full')}`;if(i===3){let symbols=['☀','☾','✦','◆'];return `<div class="panel"><div class="eyebrow">ENGRAVED INSTRUCTION</div><p>“A new day begins with <b>light</b>, gives way to <b>night</b>, reveals the <b>stars</b>, and finally the <b>diamond</b>.”</p><p class="sm">Tap each dial to rotate its symbol until the four positions match the inscription.</p></div><div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">${s.dials.map((v,j)=>`<button class="key symbol" data-action="dial" data-val="${j}" aria-label="Rotate dial ${j+1}">${symbols[v]}</button>`).join('')}</div><div style="height:14px"></div>${button('RELEASE VAULT LOCK →','submit','primary full')}`};return `<div class="panel"><div class="eyebrow">PROJECT AURORA RECOVERED</div><p>The emergency exit needs six digits in three fragments. The exit manual says to enter the fragments in the following order:</p><div class="log">1. Inside contact badge</div><div class="log">2. Vault lock marking</div><div class="log">3. Terminal override</div><p class="sm">Retrieve the three numbers from your <b>Evidence Locker</b>. They are not displayed on this console.</p></div>${keyboard(6)}`}
function game(){s.page='play';page(`${header()}${puzzle()}${s.message?`<div role="status" class="message ${s.messageType}">${esc(s.message)}</div>`:''}${s.hint?`<div class="message hint">${esc(['Inspect all four camera feeds. The digits must follow camera order.','The values double each time.','The correct employee must have BOTH Level 5 and a 23:20 activity time.','Set the symbols to sun → moon → star → diamond.','The three fragments are in your Evidence Locker. Enter badge, vault, terminal.'][s.step])}</div>`:''}<div class="actions">${button('💡 Hint (−100)','hint')}${button('▤ Evidence Locker','locker')}</div><p class="foot">Hints: ${s.hints} · Incorrect submissions: ${s.errors}<br/>Progress automatically saved on this device.</p>`)}function locker(){s.page='locker';page(`<div class="eyebrow">CLASSIFIED RECORDS</div><h2>Your Evidence Locker</h2><p>Every solved puzzle adds evidence here. You can reference these details throughout the mission.</p>${s.evidence.length?s.evidence.map((e,i)=>`<div class="log"><span class="eyebrow">ITEM 0${i+1}</span><div>${esc(e)}</div></div>`).join(''):`<div class="panel muted">No evidence collected yet.</div>`}<div style="height:14px"></div>${button('← BACK TO THE PUZZLE','play','primary full')}`)}function cleared(){s.page='cleared';page(`<div class="win"><div class="medal">✦</div><div class="eyebrow">STAGE CLEARED</div><h2>${rooms[s.step].title}</h2><p>${esc(s.message)}</p></div><div class="panel"><div class="eyebrow">NEW EVIDENCE ADDED</div><p class="contrast">${esc(s.evidence[s.evidence.length-1])}</p></div>${button(s.step===4?'ESCAPE THE BANK →':'CONTINUE TO NEXT STAGE →','advance','primary full')}`)}function finish(win){stopTimer();s.ended=true;s.page='result';s.won=win;result()}function result(){s.page='result';const elapsed=maxSeconds-s.remaining;const points=s.won?Math.max(0,5000+s.remaining*2-s.hints*100-s.errors*50):0;page(`<div class="win"><div class="medal">${s.won?'✧':'⌛'}</div><div class="eyebrow">${s.won?'MISSION COMPLETED':'MISSION FAILED'}</div><h1>${s.won?'YOU ESCAPED':'LOCKDOWN'}</h1><p>${s.won?'Your crew escaped with Project AURORA. One last line is stamped across the file: “THE CLIENT IS PART OF IT.” To be continued…':'The lockdown finished before you could escape. Restart the case and test a new strategy.'}</p><div class="score">${points.toLocaleString()} PTS</div></div><div class="grid"><div class="panel"><div class="eyebrow">TIME USED</div><h3>${Math.floor(elapsed/60)}m ${elapsed%60}s</h3></div><div class="panel"><div class="eyebrow">PUZZLES SOLVED</div><h3>${s.solved.length}/5</h3></div><div class="panel"><div class="eyebrow">HINTS USED</div><h3>${s.hints}</h3></div><div class="panel"><div class="eyebrow">WRONG ANSWERS</div><h3>${s.errors}</h3></div></div><div class="panel"><div class="eyebrow">THE INVESTIGATORS</div><p>${s.names.map(esc).join(' · ')}</p></div>${button('PLAY AGAIN →','restart','primary full')}`)}function correct(msg,evidence){s.message=msg;s.messageType='good';s.hint=false;s.solved.push(s.step);s.evidence.push(evidence);cleared()}function incorrect(){s.errors++;s.message='Access denied. Review your clues and try again.';s.messageType='bad';game()}function handle(action,val){switch(action){case'home':home();break;case'lobby':lobby();break;case'add':if(s.names.length<6)s.names.push(`Player ${s.names.length+1}`);lobby();break;case'remove':if(s.names.length>2)s.names.pop();lobby();break;case'briefing':briefing();break;case'start':s.remaining=maxSeconds;s.deadline=Date.now()+s.remaining*1000;s.step=0;s.solved=[];s.evidence=[];s.errors=0;s.hints=0;s.ended=false;s.found=[];startTimer();game();break;case'resume':if(!s.deadline)s.deadline=Date.now()+s.remaining*1000;startTimer();game();break;case'camera':{let c=Number(val);if(!s.found.includes(c))s.found.push(c);s.message=`CAM 0${c+1} footage recovered.`;s.messageType='';game();break}case'key':if(val==='CLEAR')s.entry='';else if(val==='⌫')s.entry=s.entry.slice(0,-1);else if(s.entry.length<(s.step===0?4:s.step===1?2:6))s.entry+=val;s.message='';game();break;case'select':s.selected=Number(val);game();break;case'dial':s.dials[Number(val)]=(s.dials[Number(val)]+1)%4;game();break;case'hint':if(!s.hint){s.hints++;s.hint=true}game();break;case'locker':locker();break;case'play':game();break;case'advance':if(s.step===4){finish(true)}else{s.step++;s.entry='';s.message='';s.selected=null;s.hint=false;game()}break;case'restart':s=fresh();home();break;case'submit':if(s.step===0){if(s.found.length===4&&s.entry==='4826')correct('Security gateway unlocked. The compromised terminal is now accessible.','Security access password: 4826');else incorrect()}else if(s.step===1){if(s.entry==='32')correct('Override accepted. Employee access logs restored.','Terminal override fragment: 32');else incorrect()}else if(s.step===2){if(s.selected===1)correct('Mara Voss authorized the transfer. Her badge has been recovered.','Inside contact: Mara Voss · Badge fragment: 64');else incorrect()}else if(s.step===3){if(s.dials.every((x,i)=>x===i))correct('The vault doors part. Project AURORA has been recovered.','Vault engraving fragment: 19');else incorrect()}else if(s.entry==='641932')correct('Exit override accepted. Security gates disengaged.','Exit override: 641932');else incorrect();break}}
function startTimer(){stopTimer();if(!s.deadline)s.deadline=Date.now()+s.remaining*1000;tick=setInterval(()=>{if(s.ended){stopTimer();return}let next=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if(next!==s.remaining){s.remaining=next;let node=document.getElementById('clock');if(node){node.textContent=time();node.classList.toggle('danger',next<300)}if(next%5===0)save();if(next===0)finish(false)}},400)}function stopTimer(){if(tick)clearInterval(tick);tick=null}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b.dataset.val)});app.addEventListener('input',e=>{if(e.target.matches('[data-name]')){const n=Number(e.target.dataset.name);s.names[n]=e.target.value||`Player ${n+1}`;save()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&s.deadline&&!s.ended){s.remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if(s.remaining===0)finish(false);else if(s.page==='play')game()}});load();if(s.ended)result();else if(s.deadline){s.remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if(s.remaining===0)finish(false);else{startTimer();game()}}else home();
})();
</script></body></html>
